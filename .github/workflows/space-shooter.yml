name: Space Shooter

on:
  schedule:
    - cron: "17 8 * * *" # daily
  workflow_dispatch: # run it manually from the Actions tab
  push:
    paths:
      - scripts/space_shooter.py
      - .github/workflows/space-shooter.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gh-space-shooter
        run: pip install "gh-space-shooter>=2,<3"

      - name: Generate themed GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          python scripts/space_shooter.py "${{ github.repository_owner }}" \
            --output assets/space-shooter.gif \
            --strategy random \
            --fps 30

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/space-shooter.gif
          git diff --cached --quiet && exit 0
          git commit -m "chore: update space shooter [skip ci]"
          git push
