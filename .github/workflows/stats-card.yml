name: Stats Card

on:
  schedule:
    - cron: "41 9 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/stats_card.py
      - .github/workflows/stats-card.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/stats_card.py "${{ github.repository_owner }}" -o assets/stats.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update stats card [skip ci]"
          git pull --rebase
          git push
